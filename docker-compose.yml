version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: engineering-tool-db
    # #283: credentials via env substitution. The ":-" default keeps the dev
    # workflow working out of the box; in production, set DB_USER /
    # DB_PASSWORD / DB_NAME in a .env file or shell environment. The
    # backup service already uses the same pattern.
    environment:
      POSTGRES_USER: ${DB_USER:-engineering_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-engineering_password}
      POSTGRES_DB: ${DB_NAME:-engineering_tool}
    ports:
      # Dev convenience: expose 5432 to the host so Prisma Studio / local
      # psql work. Production deploys should override this file with a
      # docker-compose.prod.yml that drops the host port mapping (see
      # #283 follow-up).
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # #283: restart policy so a DB crash self-recovers without manual
    # intervention (backup service already has this).
    restart: unless-stopped

  backup:
    image: postgres:15-alpine
    container_name: engineering-tool-backup
    environment:
      PGPASSWORD: ${DB_PASSWORD:-engineering_password}
      PGUSER: ${DB_USER:-engineering_user}
      PGDATABASE: ${DB_NAME:-engineering_tool}
      PGHOST: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Optional: set S3_BACKUP_BUCKET to enable off-host backup uploads.
      # Also set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION.
      # Leave S3_BACKUP_BUCKET unset (or empty) to disable S3 upload.
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: /bin/sh
    command: >
      -c "apk add --no-cache aws-cli --quiet 2>/dev/null || true &&
          mkdir -p /backups &&
          echo '0 2 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
          crond -f -d 8"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
