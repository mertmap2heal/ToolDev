  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a9c76330-9f06-4acc-88db-05e999af0e65\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7bd6c1af-b3a1-433a-83fd-c13e27bc4642\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"002537d1-6544-4023-b044-5c12b581dd34\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5312747e-bc58-4cd1-af76-822fc58e0175\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5dd58c1f-6181-4161-8972-0272ff03cc1f\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7f650e0a-6f17-4cbf-a4e8-645e62def805\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a9c76330-9f06-4acc-88db-05e999af0e65\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================================\n   1) VERUM BRAND  —  marketing / pitch / decks\n   ============================================================================ */\n.verum {\n  /* ---- Color tokens ----------------------------------------------------- */\n  /* Ink (text) */\n  --ink-primary:           #0F1419;\n  --ink-muted:             #6B6660;\n  --ink-faint:             #A8A29A;\n\n  /* Surface (warm paper neutrals) */\n  --surface-base:          #FAF8F3;\n  --surface-raised:        #F2EEE3;\n  --surface-inset:         #EBE5D5;\n\n  /* Border */\n  --border-default:        #E2DCCD;\n  --border-strong:         #C9C2AF;\n\n  /* Brand accent — forest green */\n  --accent-primary:        #1B4332;\n  --accent-primary-hover:  #2D5A3D;\n  --accent-primary-text:   #FAF8F3;\n\n  /* Status (muted, archival) */\n  --status-success:        #1B4332;\n  --status-warning:        #B8860B;\n  --status-danger:         #8B0000;\n\n  /* Semantic aliases */\n  --fg-1:                  var(--ink-primary);\n  --fg-2:                  var(--ink-muted);\n  --fg-3:                  var(--ink-faint);\n  --bg-1:                  var(--surface-base);\n  --bg-2:                  var(--surface-raised);\n  --bg-3:                  var(--surface-inset);\n  --line-1:                var(--border-default);\n  --line-2:                var(--border-strong);\n\n  /* ---- Type families ---------------------------------------------------- */\n  --font-display:          \"Fraunces\", ui-serif, Georgia, serif;\n  --font-body:             \"Geist\", \"Geist Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono:             \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ---- Type scale ------------------------------------------------------- */\n  --display-xl:            72px;  /* hero h1 */\n  --display-lg:            56px;  /* section h2 */\n  --display-md:            40px;  /* sub-section h3 */\n  --title-lg:              32px;\n  --title-md:              24px;\n  --title-sm:              18px;\n  --body-lg:               17px;\n  --body-md:               15px;\n  --body-sm:               13px;\n  --caption:               12px;\n\n  /* ---- Spacing & shape ------------------------------------------------- */\n  --radius-xs:             2px;\n  --radius-sm:             4px;\n  --radius-md:             6px;\n  --space-section:         96px;\n  --space-section-tight:   64px;\n  --space-section-loose:   128px;\n\n  /* ---- Surface defaults ------------------------------------------------ */\n  background-color: var(--surface-base);\n  color: var(--ink-primary);\n  font-family: var(--font-body);\n  font-size: var(--body-md);\n  line-height: 1.5;\n  letter-spacing: -0.01em;\n  font-weight: 400;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  font-synthesis: none;\n}\n\n/* ---- Verum semantic typography (drop these classes onto elements) ------ */\n.verum h1,\n.verum .h1 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--display-xl);\n  line-height: 1.05;\n  letter-spacing: -0.03em;\n  color: var(--ink-primary);\n  margin: 0;\n}\n.verum h2,\n.verum .h2 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--display-lg);\n  line-height: 1.08;\n  letter-spacing: -0.03em;\n  color: var(--ink-primary);\n  margin: 0;\n}\n.verum h3,\n.verum .h3 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--display-md);\n  line-height: 1.1;\n  letter-spacing: -0.02em;\n  color: var(--ink-primary);\n  margin: 0;\n}\n.verum h4,\n.verum .h4 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--title-md);\n  line-height: 1.2;\n  letter-spacing: -0.01em;\n  margin: 0;\n}\n.verum p,\n.verum .body {\n  font-size: var(--body-md);\n  line-height: 1.55;\n  margin: 0;\n}\n.verum .body-lg {\n  font-size: var(--body-lg);\n  color: var(--ink-muted);\n  line-height: 1.55;\n}\n.verum .body-sm {\n  font-size: var(--body-sm);\n  line-height: 1.5;\n}\n.verum .caption,\n.verum small {\n  font-family: var(--font-mono);\n  font-size: var(--caption);\n  line-height: 1.4;\n  color: var(--ink-muted);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n.verum .eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--caption);\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--accent-primary);\n}\n.verum code,\n.verum .mono {\n  font-family: var(--font-mono);\n  font-size: var(--body-sm);\n  letter-spacing: 0;\n}\n\n/* ============================================================================\n   2) APP THEME — in-product UI (light + midnight)\n   ============================================================================ */\n.app,\n.app[data-theme=\"light\"] {\n  /* GitHub Light */\n  --theme-bg:                  #ffffff;\n  --theme-surface:             #f6f8fa;\n  --theme-sidebar:             #f6f8fa;\n  --theme-text:                #1f2328;\n  --theme-text-muted:          #656d76;\n  --theme-border:              #d0d7de;\n  --theme-accent:              #0969da;\n  --theme-accent-subtle:       #ddf4ff;\n  --theme-sidebar-item-hover:  rgba(175, 184, 193, 0.20);\n  --theme-sidebar-item-active: rgba(175, 184, 193, 0.30);\n\n  /* Status (UI palette) */\n  --theme-success:             #22c55e;\n  --theme-warning:             #f59e0b;\n  --theme-danger:              #ef4444;\n  --theme-info:                #3b82f6;\n\n  color-scheme: light;\n}\n\n.app[data-theme=\"midnight\"] {\n  /* GitHub Dark */\n  --theme-bg:                  #0d1117;\n  --theme-surface:             #161b22;\n  --theme-sidebar:             #010409;\n  --theme-text:                #e6edf3;\n  --theme-text-muted:          #8b949e;\n  --theme-border:              #30363d;\n  --theme-accent:              #2f81f7;\n  --theme-accent-subtle:       #1f3a5f;\n  --theme-sidebar-item-hover:  rgba(177, 186, 196, 0.08);\n  --theme-sidebar-item-active: rgba(177, 186, 196, 0.14);\n\n  --theme-success:             #3fb950;\n  --theme-warning:             #d29922;\n  --theme-danger:              #f85149;\n  --theme-info:                #2f81f7;\n\n  color-scheme: dark;\n}\n\n.app {\n  /* Type — Inter, dense */\n  --app-font:        \"Inter\", system-ui, Avenir, Helvetica, Arial, sans-serif;\n  --app-font-mono:   \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Type scale (notice it is much smaller than Verum brand — this is a\n     dense data tool, not a marketing site) */\n  --app-text-xs:     10px;\n  --app-text-sm:     11px;\n  --app-text-base:   12px;\n  --app-text-md:     13px;   /* canonical body */\n  --app-text-lg:     14px;\n  --app-text-xl:     16px;   /* page title */\n  --app-text-2xl:    18px;\n  --app-stat-num:    28px;   /* dashboard stat numbers */\n\n  /* Shape */\n  --app-radius-sm:   4px;\n  --app-radius-md:   6px;\n  --app-radius-lg:   8px;\n\n  font-family: var(--app-font);\n  font-size: var(--app-text-md);\n  font-weight: 400;\n  line-height: 1.4;\n  color: var(--theme-text);\n  background-color: var(--theme-bg);\n  font-synthesis: none;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* ---- App semantic typography ------------------------------------------- */\n.app .page-title {\n  font-size: var(--app-text-xl);\n  font-weight: 600;\n  color: var(--theme-text);\n  letter-spacing: -0.005em;\n}\n.app .toolbar-title {\n  /* Per STYLE_CONSISTENCY_AUDIT: every page heading is text-lg font-bold (=18px on\n     Tailwind, 14-16px in this app's Inter base). Use var(--app-text-lg) bold */\n  font-size: var(--app-text-lg);\n  font-weight: 700;\n  color: var(--theme-text);\n}\n.app .label-caps {\n  font-size: var(--app-text-xs);\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n  color: var(--theme-text-muted);\n  font-weight: 500;\n}\n.app .body-text {\n  font-size: var(--app-text-md);\n  color: var(--theme-text);\n}\n.app .meta {\n  font-size: var(--app-text-sm);\n  color: var(--theme-text-muted);\n}\n.app .mono {\n  font-family: var(--app-font-mono);\n  font-size: var(--app-text-md);\n}\n\n/* ---- Pre-canned border helper ----------------------------------------- */\n.app .hairline,\n.verum .hairline {\n  border: 0;\n  border-top: 1px solid var(--theme-border, var(--border-default));\n}\n<\u002Fstyle>\n<script src=\"f0f8e046-a882-4eda-810b-ec6bcd73f42a\"><\u002Fscript>\n<style>\n  /* ============================================================\n     v2 — GitLab temperament, database-client density.\n     - Calm off-white surface, gray sidebars, real buttons (not links).\n     - Tight 32px rows, frozen Name column, inline-edit affordances.\n     - Inter for UI; JetBrains Mono for IDs / values / formulas / units.\n     - Sentence case throughout. No uppercase chrome labels.\n     - Blue (#0969da) for action; forest green for \"released\".\n     ============================================================ */\n  html, body { margin: 0; padding: 0; }\n  body { background: #ECEEF0; font-family: var(--app-font); }\n\n  .app {\n    /* Surfaces */\n    --bg:           #FBFBFA;       /* main canvas */\n    --surface:      #F4F5F2;       /* sidebar, toolbar, group rows */\n    --surface-2:    #ECEEEA;       /* hover, group emphasis */\n    --surface-soft: #F8F8F6;       /* table zebra */\n\n    /* Text */\n    --fg:           #1F2328;\n    --fg-2:         #424A53;\n    --fg-3:         #6E7781;\n    --fg-4:         #9DA4AB;\n\n    /* Lines */\n    --line:         #DEE0E2;       /* default */\n    --line-strong:  #C9CDD1;       /* heavier */\n    --line-soft:    #E8EAEC;       /* faintest */\n\n    /* Action */\n    --blue:         #0969DA;\n    --blue-hover:   #0860C7;\n    --blue-tint:    #DDF1FF;\n    --blue-ink:     #054EA3;\n\n    /* Status */\n    --green:        #1B4332;\n    --green-tint:   #E5EFE9;\n    --amber:        #B8860B;\n    --amber-tint:   #FBF0D8;\n    --red:          #B42318;\n    --red-tint:     #FBE9E7;\n    --gray-tint:    #ECEEF0;\n\n    width: 1440px;\n    margin: 0 auto;\n    background: var(--bg);\n    color: var(--fg);\n    font-size: 13px;\n    line-height: 1.45;\n    min-height: 100vh;\n    display: grid;\n    grid-template-rows: 44px 1fr 28px;\n    grid-template-columns: 232px 1fr 0px;\n    border: 1px solid var(--line);\n    transition: grid-template-columns 180ms ease;\n  }\n  .app.has-drawer { grid-template-columns: 232px 1fr 520px; }\n  .app.has-drawer.drawer-expanded { grid-template-columns: 232px 0px 1fr; }\n  .app.is-collapsed { grid-template-columns: 0px 1fr 0px; }\n  .app.is-collapsed.has-drawer { grid-template-columns: 0px 1fr 520px; }\n  .app.is-collapsed.has-drawer.drawer-expanded { grid-template-columns: 0px 0px 1fr; }\n  .app.is-collapsed .sidebar { width: 0; padding: 0; border-right: 0; overflow: hidden; }\n  .app.is-collapsed .sidebar > * { display: none; }\n  .topbar-toggle { display: none !important; }\n  .app.is-collapsed .topbar-toggle { display: inline-flex !important; }\n  .inline-toggle {\n    width: 22px; height: 22px;\n    margin-right: 4px;\n    color: var(--fg-3);\n  }\n  .inline-toggle:hover { background: var(--surface-2); color: var(--fg); }\n\n  /* TOPBAR -------------------------------------------------- */\n  .topbar {\n    grid-column: 1 / -1;\n    display: flex; align-items: center; gap: 16px;\n    padding: 0 16px;\n    background: var(--bg);\n    border-bottom: 1px solid var(--line);\n    height: 44px;\n  }\n  .brand { display: flex; align-items: center; gap: 10px; }\n  .brand .mark svg { display: block; }\n  .brand .name { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }\n  .brand .name .sub { display: block; font-size: 11px; color: var(--fg-3); font-weight: 400; line-height: 1.1; }\n  .topbar .search-global {\n    flex: 1; max-width: 420px;\n    display: flex; align-items: center; gap: 8px;\n    height: 28px;\n    padding: 0 10px;\n    background: var(--surface);\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    color: var(--fg-3);\n    font-size: 12px;\n  }\n  .topbar .search-global:hover { background: var(--bg); }\n  .topbar .search-global input { all: unset; flex: 1; color: var(--fg); }\n  .topbar .search-global input::placeholder { color: var(--fg-3); }\n  .topbar .search-global .kbd {\n    font-family: var(--app-font-mono); font-size: 10px;\n    color: var(--fg-3); border: 1px solid var(--line);\n    padding: 0 5px; line-height: 14px; border-radius: 3px;\n    background: var(--bg);\n  }\n  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }\n  .icon-btn {\n    width: 28px; height: 28px;\n    display: inline-flex; align-items: center; justify-content: center;\n    color: var(--fg-3); border-radius: 6px; cursor: pointer;\n  }\n  .icon-btn:hover { background: var(--surface); color: var(--fg); }\n  .topbar .avatar {\n    width: 26px; height: 26px; border-radius: 999px;\n    background: linear-gradient(135deg, #d6e2ec, #bccddb);\n    color: var(--fg-2); font-size: 11px; font-weight: 600;\n    display: inline-flex; align-items: center; justify-content: center;\n    margin-left: 4px;\n  }\n\n  /* SIDEBAR ------------------------------------------------- */\n  .sidebar {\n    background: var(--surface);\n    border- .dr-kv {\n    display: grid;\n    grid-template-columns: 130px 1fr;\n    row-gap: 8px; column-gap: 16px;\n    font-size: 13px;\n  }\n  .dr-kv dt { color: var(--fg-3); font-weight: 400; }\n  .dr-kv dd { margin: 0; color: var(--fg); }\n  .dr-kv .mono { font-family: var(--app-font-mono); font-size: 12.5px; }\n  .dr-kv .src-link { color: var(--blue, #0969DA); text-decoration: none; cursor: pointer; }\n  .dr-kv .src-link:hover { text-decoration: underline; }\n  .dr-kv .author {\n    display: inline-flex; align-items: center; gap: 6px;\n  }\n  .dr-kv .author .avatar {\n    width: 18px; height: 18px; border-radius: 999px;\n    background: linear-gradient(135deg, #d6e2ec, #bccddb);\n    color: var(--fg-2); font-size: 9px; font-weight: 600;\n    display: inline-flex; align-items: center; justify-content: center;\n  }\n\n  /* USED-IN refs */\n  .dr-refs { display: flex; flex-direction: column; gap: 6px; }\n  .dr-ref {\n    display: flex; align-items: center; gap: 10px;\n    padding: 8px 10px;\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    background: var(--bg);\n    font-size: 12.5px;\n    cursor: pointer;\n  }\n  .dr-ref:hover { background: var(--surface-soft); border-color: var(--line-strong); }\n  .dr-ref .ref-kind {\n    display: inline-flex; align-items: center; justify-content: center;\n    width: 22px; height: 22px; border-radius: 4px;\n    background: var(--surface-2); color: var(--fg-3);\n  }\n  .dr-ref .ref-kind.req { background: rgba(9,105,218,0.10); color: var(--blue-ink); }\n  .dr-ref .ref-kind.test { background: rgba(27, 67, 50, 0.08); color: var(--green); }\n  .dr-ref .ref-kind.param { background: rgba(91, 33, 182, 0.08); color: #5B21B6; }\n  .dr-ref .ref-id {\n    font-family: var(--app-font-mono); font-size: 11px;\n    color: var(--fg-3); min-width: 84px;\n  }\n  .dr-ref .ref-title { color: var(--fg); flex: 1; }\n  .dr-ref .ref-meta { color: var(--fg-3); font-size: 11px; }\n  .dr-section .more-link {\n    display: inline-block; margin-top: 8px;\n    color: var(--blue); font-size: 12px; cursor: pointer;\n  }\n  .dr-section .more-link:hover { text-decoration: underline; }\n\n  /* HISTORY timeline */\n  .dr-timeline { position: relative; padding-left: 18px; }\n  .dr-timeline::before {\n    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;\n    width: 1px; background: var(--line);\n  }\n  .dr-event {\n    position: relative; padding: 0 0 14px;\n    font-size: 12.5px;\n  }\n  .dr-event:last-child { padding-bottom: 0; }\n  .dr-event::before {\n    content: ''; position: absolute; left: -15px; top: 5px;\n    width: 7px; height: 7px; border-radius: 999px;\n    background: var(--bg); border: 2px solid var(--fg-4);\n  }\n  .dr-event.is-publish::before { border-color: var(--green); }\n  .dr-event.is-edit::before { border-color: var(--blue); }\n  .dr-event.is-stale::before { border-color: var(--amber); }\n  .dr-event .e-row { display: flex; align-items: center; gap: 8px; }\n  .dr-event .e-action { color: var(--fg); }\n  .dr-event .e-action b { font-weight: 600; }\n  .dr-event .e-meta {\n    margin-left: auto; color: var(--fg-3); font-size: 11px;\n    font-family: var(--app-font-mono);\n  }\n  .dr-event .e-detail {\n    margin-top: 3px; color: var(--fg-3);\n    font-family: var(--app-font-mono); font-size: 11.5px;\n  }\n\n  /* DISCUSSION */\n  .dr-comment {\n    display: flex; gap: 10px; padding: 10px 0;\n    border-bottom: 1px dashed var(--line-soft);\n  }\n  .dr-comment:last-of-type { border-bottom: 0; }\n  .dr-comment .avatar {\n    flex-shrink: 0;\n    width: 24px; height: 24px; border-radius: 999px;\n    background: linear-gradient(135deg, #d6e2ec, #bccddb);\n    color: var(--fg-2); font-size: 10px; font-weight: 600;\n    display: inline-flex; align-items: center; justify-content: center;\n  }\n  .dr-comment .body { flex: 1; font-size: 12.5px; }\n  .dr-comment .head { display: flex; align-items: baseline; gap: 8px; }\n  .dr-comment .head b { font-size: 12.5px; font-weight: 600; color: var(--fg); }\n  .dr-comment .head .when { color: var(--fg-3); font-size: 11px; }\n  .dr-comment .text { color: var(--fg-2); margin-top: 2px; line-height: 1.5; }\n  .dr-comment-add {\n    margin-top: 8px;\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    padding: 8px 10px;\n    font-size: 12.5px;\n    color: var(--fg-3);\n    background: var(--bg);\n    cursor: text;\n  }\n  .dr-comment-add:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(9,105,218,0.12); }\n\n  /* FOOTER */\n  .dr-foot {\n    display: flex; align-items: center; gap: 8px;\n    padding: 10px 14px;\n    border-top: 1px solid var(--line);\n    background: var(--surface);\n  }\n  .dr-foot .left { display: flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 11px; }\n  .dr-foot .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }\n  .dr-btn {\n    display: inline-flex; align-items: center; gap: 6px;\n    height: 28px; padding: 0 12px;\n    border: 1px solid var(--line-strong);\n    background: var(--bg);\n    border-radius: 6px;\n    font-size: 12.5px; color: var(--fg);\n    cursor: pointer;\n  }\n  .dr-btn:hover { background: var(--surface-soft); }\n  .dr-btn.primary {\n    background: var(--blue); color: #fff; border-color: var(--blue);\n  }\n  .dr-btn.primary:hover { background: var(--blue-hover); }\n  .dr-btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }\n  .dr-btn.ghost:hover { background: var(--surface-2); }\n<\u002Fstyle>\n\n<script>\n  (function () {\n    var app = document.querySelector('.app');\n    var drawer = document.getElementById('drawer');\n    var closeBtn = document.getElementById('drClose');\n    var expandBtn = document.getElementById('drExpand');\n\n    function openDrawer(row) {\n      if (row) {\n        var nm = row.querySelector('.cell-name .nm');\n        var id = row.querySelector('.cell-name .id');\n        if (nm) document.getElementById('drName').textContent = nm.textContent;\n        if (id) document.getElementById('drId').textContent = id.textContent;\n        var disp = document.querySelector('.dr-display');\n        if (disp && nm) disp.textContent = nm.textContent;\n        // mark active row\n        document.querySelectorAll('table.params tbody tr.is-active').forEach(function (r) { r.classList.remove('is-active'); });\n        row.classList.add('is-active');\n      }\n      app.classList.add('has-drawer');\n      drawer.setAttribute('aria-hidden', 'false');\n      if (window.lucide && lucide.createIcons) lucide.createIcons();\n    }\n    function closeDrawer() {\n      app.classList.remove('has-drawer');\n      app.classList.remove('drawer-expanded');\n      drawer.setAttribute('aria-hidden', 'true');\n      document.querySelectorAll('table.params tbody tr.is-active').forEach(function (r) { r.classList.remove('is-active'); });\n      expandBtn.setAttribute('title', 'Expand');\n    }\n    function toggleExpand() {\n      var expanded = app.classList.toggle('drawer-expanded');\n      expandBtn.setAttribute('title', expanded ? 'Collapse' : 'Expand');\n    }\n\n    closeBtn.addEventListener('click', closeDrawer);\n    expandBtn.addEventListener('click', toggleExpand);\n    document.addEventListener('keydown', function (e) {\n      if (e.key === 'Escape') closeDrawer();\n    });\n\n    // Wire row clicks\n    document.querySelectorAll('table.params tbody tr').forEach(function (tr) {\n      if (tr.classList.contains('group-row')) return;\n      if (tr.classList.contains('filter-row')) return;\n      tr.style.cursor = 'pointer';\n      tr.addEventListener('click', function (e) {\n        var t = e.target;\n        if (t.closest('input, button, a, .icon-btn, .star, .row-actions')) return;\n        openDrawer(tr);\n      });\n    });\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
