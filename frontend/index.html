<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Project Development Tool</title>
    <script>
      // Prevent flash of wrong theme
      (function() {
        var theme = localStorage.getItem('app-theme') || 'midnight';
        if (theme === 'midnight') document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
