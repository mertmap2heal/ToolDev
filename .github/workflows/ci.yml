name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Blocking secret scan (issue #173). Fails the build if any known
      # credential pattern (AWS keys, JWT secrets, high-entropy strings,
      # the previously leaked test password, etc.) is found in any tracked
      # file or in the diff of this PR.
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../frontend && npm ci
          cd ../backend && npm ci
      - name: Lint frontend
        run: cd frontend && npm run lint
      - name: Lint backend
        run: cd backend && npm run build

      - name: Guard against body.signerId / body.userId in certification controllers (#163)
        run: |
          if grep -RnE "(req\\.)?body\\.(signerId|userId)" backend/src/controllers/certification/; then
            echo "ERROR: body.signerId / body.userId found in certification controllers."
            echo "Signer identity must come from req.user only (issue #163)."
            exit 1
          fi
          echo "OK: certification controllers do not read signer identity from request body."

      - name: Guard inventory + task services use dual-storage auth (#299)
        run: |
          set -e
          inv=frontend/src/services/inventory.service.ts
          task=frontend/src/services/task.service.ts
          fail=0
          # inventory.service must read tokens from both localStorage AND
          # sessionStorage and handle 401/403 via token-expired event.
          if ! grep -q "sessionStorage.getItem('token')" "$inv"; then
            echo "::error file=$inv::must read token from sessionStorage (see issue #299)"
            fail=1
          fi
          if ! grep -q "token-expired" "$inv"; then
            echo "::error file=$inv::must dispatch token-expired on 401/403 (see issue #299)"
            fail=1
          fi
          # task.service.exportTasks must not fetch directly with
          # localStorage.getItem('token') — it should go through apiClient.
          if grep -qE "fetch\(.*csv/export" "$task"; then
            echo "::error file=$task::exportTasks must use apiClient.postBlob, not raw fetch (see issue #299)"
            fail=1
          fi
          if grep -qE "Authorization:.*localStorage\.getItem\('token'\)" "$task"; then
            echo "::error file=$task::must not build raw Authorization header from localStorage only (see issue #299)"
            fail=1
          fi
          exit $fail

      - name: Guard bulk verification mutations report per-id failures (#271)
        run: |
          set -e
          f=frontend/src/pages/Verification/VerificationPage.tsx
          fail=0
          # Pre-fix: silently swallowed unlink errors with try/catch.
          if grep -qE "try\s*\{\s*await verificationService\.unlinkSetup" "$f"; then
            echo "::error file=$f::unlink must not silently swallow errors (see issue #271)"
            fail=1
          fi
          # Every bulk mutation should call Promise.allSettled so a single
          # rejection doesn't abandon the rest of the batch.
          if ! grep -q "Promise.allSettled" "$f"; then
            echo "::error file=$f::bulk mutations must use Promise.allSettled (see issue #271)"
            fail=1
          fi
          exit $fail

      - name: Guard Issues label colours pass through safeHexColor (#268)
        run: |
          set -e
          f=frontend/src/pages/Issues/IssuesPage.tsx
          helper=frontend/src/utils/safeColor.ts
          fail=0
          if [ ! -f "$helper" ]; then
            echo "::error file=$helper::safeColor helper missing (see issue #268)"
            fail=1
          fi
          # Direct interpolation of l.color / lab.color into style is the
          # pre-fix shape.
          if grep -qE 'backgroundColor:\s*`\$\{(?:l|lab)\.color\}20`' "$f"; then
            echo "::error file=$f::label color must pass through safeHexColorTint (see issue #268)"
            fail=1
          fi
          if ! grep -q "safeHexColor" "$f"; then
            echo "::error file=$f::must use safeHexColor helpers (see issue #268)"
            fail=1
          fi
          exit $fail

      - name: Guard Issues module error handlers stay typed (#267)
        run: |
          set -e
          fail=0
          for f in \
            frontend/src/pages/Issues/IssuesPage.tsx \
            frontend/src/pages/Issues/IssueDetailPage.tsx \
            frontend/src/components/issues/IssueSidebar.tsx; do
            if grep -qE "onError:\s*\(error:\s*any\)" "$f"; then
              echo "::error file=$f::onError must not use any (see issue #267)"
              fail=1
            fi
          done
          if ! grep -q "errorMessage" frontend/src/utils/errorMessage.ts; then
            echo "::error::errorMessage helper missing (see issue #267)"
            fail=1
          fi
          exit $fail

      - name: Guard Git publish config does not persist token (#272)
        run: |
          set -e
          modal=frontend/src/components/parameters/PublishToGitModal.tsx
          page=frontend/src/pages/Parameters/ParametersPage.tsx
          fail=0
          # The persisted config type must NOT declare a `token` field.
          if grep -qE "^\s*token:\s*string$" "$modal"; then
            echo "::error file=$modal::GitPublishStoredConfig must not declare a persisted token (see issue #272)"
            fail=1
          fi
          # Legacy storage sweeper must exist.
          if ! grep -q "clearLegacyGitPublishStorage" "$modal"; then
            echo "::error file=$modal::missing clearLegacyGitPublishStorage helper (see issue #272)"
            fail=1
          fi
          if ! grep -q "clearLegacyGitPublishStorage" "$page"; then
            echo "::error file=$page::ParametersPage must purge legacy token storage on mount (see issue #272)"
            fail=1
          fi
          # Persisted config reads must not restore the token field.
          if grep -qE "setToken\(cfg\.token" "$modal"; then
            echo "::error file=$modal::must not restore persisted token (see issue #272)"
            fail=1
          fi
          if grep -qE "storedGitConfig\.token" "$page"; then
            echo "::error file=$page::ParametersPage must not reference storedGitConfig.token (see issue #272)"
            fail=1
          fi
          exit $fail

      - name: Guard CSV/Excel exports neutralise formula triggers (#269)
        run: |
          set -e
          helper=frontend/src/utils/csvExport.ts
          fail=0
          if [ ! -f "$helper" ]; then
            echo "::error file=$helper::csvExport helper missing (see issue #269)"
            fail=1
          else
            for needle in csvSafeValue csvSafeField csvSafeRow csvSafeRows FORMULA_PREFIXES; do
              if ! grep -q "$needle" "$helper"; then
                echo "::error file=$helper::missing export $needle (see issue #269)"
                fail=1
              fi
            done
          fi
          cr=frontend/src/pages/ChangeRequests/ChangeRequestsPage.tsx
          if ! grep -q "csvSafeField" "$cr"; then
            echo "::error file=$cr::change-request CSV export must use csvSafeField (see issue #269)"
            fail=1
          fi
          tm=frontend/src/pages/Verification/TraceabilityMatrixView.tsx
          if ! grep -q "csvSafeRows" "$tm"; then
            echo "::error file=$tm::traceability matrix export must use csvSafeRows (see issue #269)"
            fail=1
          fi
          exit $fail

      - name: Guard against unsanitized dangerouslySetInnerHTML (#169)
        run: |
          set -e
          unsanitized=$(grep -rn "dangerouslySetInnerHTML" frontend/src || true)
          if [ -z "$unsanitized" ]; then
            exit 0
          fi
          fail=0
          while IFS= read -r line; do
            case "$line" in
              *sanitizeHtml*|*sanitizeSvg*) ;;
              *) echo "::error::unsanitized dangerouslySetInnerHTML (issue #169): $line"; fail=1 ;;
            esac
          done <<< "$unsanitized"
          exit $fail

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: engineering_user
          POSTGRES_PASSWORD: engineering_password
          POSTGRES_DB: engineering_tool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install shared dependencies
        run: cd shared && npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client and push schema
        run: cd backend && npx prisma generate && npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool

      - name: Run backend unit tests
        run: cd backend && npm test
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Verify project-scoped routers declare requireProjectMember (#90)
        run: |
          set -e
          missing=0
          for f in \
            backend/src/routes/requirements.routes.ts \
            backend/src/routes/requirementReviews.routes.ts \
            backend/src/routes/requirementValidation.routes.ts \
            backend/src/routes/requirementsViewPreferences.routes.ts; do
            if ! grep -q "requireProjectMember" "$f"; then
              echo "::error file=$f::missing requireProjectMember middleware (see issue #90)"
              missing=1
            fi
          done
          exit $missing

      - name: Verify upload handlers enforce MIME allowlist + size guard (#161, #27, #295)
        run: |
          set -e
          missing=0
          for f in \
            backend/src/controllers/issue.controller.ts \
            backend/src/controllers/attachment.controller.ts; do
            if ! grep -q "ALLOWED_MIME_TYPES" "$f"; then
              echo "::error file=$f::upload handler missing MIME allowlist (see issue #161)"
              missing=1
            fi
            if ! grep -q "SAFE_FILENAME_RE" "$f"; then
              echo "::error file=$f::upload handler missing safe-filename regex (see issue #161)"
              missing=1
            fi
            if ! grep -q "MAX_BASE64_CHARS" "$f"; then
              echo "::error file=$f::upload handler missing pre-decode size guard (see issues #161, #295)"
              missing=1
            fi
            if grep -qE "path\.extname\(fileName\)" "$f"; then
              echo "::error file=$f::upload handler still trusts path.extname(fileName) - double-extension bypass (see issue #161)"
              missing=1
            fi
          done
          exit $missing

      - name: Guard against unconditional localhost CORS (#149)
        run: |
          set -e
          if grep -nE "^\s*'http://localhost:3000'" backend/src/server.ts | grep -v "NODE_ENV"; then
            echo "::error file=backend/src/server.ts::localhost:3000 must be gated on NODE_ENV !== 'production' (issue #149)"
            exit 1
          fi
          if ! grep -q "buildCorsOrigins" backend/src/server.ts; then
            echo "::error file=backend/src/server.ts::expected buildCorsOrigins env-driven allowlist (issue #149)"
            exit 1
          fi

      - name: Verify Socket.IO enforces JWT auth on handshake (#170)
        run: |
          set -e
          rtfile=backend/src/realtime/realtime.ts
          if ! grep -q "io.use" "$rtfile"; then
            echo "::error file=$rtfile::Socket.IO io.use() middleware missing (see issue #170)"
            exit 1
          fi
          if ! grep -q "verifySocketToken" "$rtfile"; then
            echo "::error file=$rtfile::verifySocketToken not referenced (see issue #170)"
            exit 1
          fi
          if grep -qE "origin:\s*'\*'" "$rtfile"; then
            echo "::error file=$rtfile::Socket.IO CORS origin is wide-open '*' (see issue #170)"
            exit 1
          fi
          if grep -q "handshake.query.admin" "$rtfile"; then
            echo "::error file=$rtfile::admin room joined via handshake.query.admin — must gate on verified role (see issue #170)"
            exit 1
          fi

      - name: Run ReqIF DoS regression (#298)
        run: cd backend && npx vitest run src/__tests__/reqif.dos.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard ReqIF import enforces size + count caps (#298)
        run: |
          set -e
          ctrl=backend/src/controllers/reqif.controller.ts
          svc=backend/src/services/reqif.service.ts
          fail=0
          if ! grep -q "MAX_REQIF_CHARS" "$ctrl"; then
            echo "::error file=$ctrl::ReqIF import must enforce MAX_REQIF_CHARS (see issue #298)"
            fail=1
          fi
          if ! grep -q "MAX_SPEC_OBJECTS" "$svc"; then
            echo "::error file=$svc::ReqIF import must enforce MAX_SPEC_OBJECTS (see issue #298)"
            fail=1
          fi
          exit $fail

      - name: Run COMPANY_ADMIN tenant regression (#281)
        run: cd backend && npx vitest run src/__tests__/companyAdmin.tenant.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard project middlewares enforce COMPANY_ADMIN tenant (#281)
        run: |
          set -e
          fail=0
          for f in \
            backend/src/middleware/resolveProjectParam.middleware.ts \
            backend/src/middleware/requireProjectMember.middleware.ts \
            backend/src/middleware/requireProjectOwnerOrAdmin.middleware.ts; do
            # Old shape granted both roles in one OR — ban that exact line.
            if grep -qE "role === 'SUPERIOR_ADMIN' \|\| user.\?role === 'COMPANY_ADMIN'" "$f"; then
              echo "::error file=$f::COMPANY_ADMIN must be tenant-checked, not or'd with SUPERIOR_ADMIN (see issue #281)"
              fail=1
            fi
            # Must now read companyName from project + company from user.
            if ! grep -q "companyName" "$f"; then
              echo "::error file=$f::select { companyName } on project lookup (see issue #281)"
              fail=1
            fi
          done
          exit $fail

      - name: Run task-template access regression (#292)
        run: cd backend && npx vitest run src/__tests__/taskTemplate.auth.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard template controller enforces project membership (#292)
        run: |
          set -e
          f=backend/src/controllers/template.controller.ts
          fail=0
          for needle in resolveCallerContext isMemberOf canAccessTemplate; do
            if ! grep -q "$needle" "$f"; then
              echo "::error file=$f::missing helper $needle (see issue #292)"
              fail=1
            fi
          done
          if ! grep -q "Only SUPERIOR_ADMIN can create a global template" "$f"; then
            echo "::error file=$f::must block non-superior global create (see issue #292)"
            fail=1
          fi
          if ! grep -q "Only SUPERIOR_ADMIN can change template scope" "$f"; then
            echo "::error file=$f::must block isGlobal toggle from non-superior (see issue #292)"
            fail=1
          fi
          exit $fail

      - name: Guard Markov page does not render fake safety metrics (#275)
        run: |
          set -e
          f=frontend/src/pages/Safety/MarkovPage.tsx
          fail=0
          if grep -qE ">0\.9999<" "$f"; then
            echo "::error file=$f::Markov Availability must not be a hardcoded 0.9999 (see issue #275)"
            fail=1
          fi
          if grep -qE ">1e-6<" "$f"; then
            echo "::error file=$f::Markov Failure probability must not be a hardcoded 1e-6 (see issue #275)"
            fail=1
          fi
          exit $fail

      - name: Guard lifecycle apply/clone/library handlers are not silent (#279)
        run: |
          set -e
          f=frontend/src/pages/LifecycleManagement/LifecycleManagementPage.tsx
          fail=0
          if grep -q "console.log('Applying lifecycle'" "$f"; then
            echo "::error file=$f::handleApply must not console.log + silently close (see issue #279)"
            fail=1
          fi
          if grep -q "console.log('Cloning lifecycle'" "$f"; then
            echo "::error file=$f::handleClone must not console.log + silently close (see issue #279)"
            fail=1
          fi
          if grep -q "console.log('Creating library'" "$f" || grep -q "console.log('Updating library'" "$f"; then
            echo "::error file=$f::library save must not log to console + return fake success (see issue #279)"
            fail=1
          fi
          if ! grep -q "not yet implemented" "$f"; then
            echo "::error file=$f::handlers must surface an explicit not-yet-implemented notice (see issue #279)"
            fail=1
          fi
          exit $fail

      - name: Guard Dashboard bulk-delete requires confirmation (#260)
        run: |
          set -e
          f=frontend/src/pages/Dashboard/DashboardPage.tsx
          fail=0
          # Pre-fix shape iterated deleteProjectMutation.mutate in a forEach.
          if grep -qE "selectedProjectIds\.forEach\(id =>\s*deleteProjectMutation\.mutate\(id\)\)" "$f"; then
            echo "::error file=$f::bulk delete must not fire-and-forget (see issue #260)"
            fail=1
          fi
          if ! grep -q "bulkDeleteConfirm" "$f"; then
            echo "::error file=$f::bulk delete must go through a confirmation modal (see issue #260)"
            fail=1
          fi
          if ! grep -q "Promise.allSettled" "$f"; then
            echo "::error file=$f::bulk delete must use Promise.allSettled (see issue #260)"
            fail=1
          fi
          exit $fail

      - name: Run PBS sync cross-project regression (#293)
        run: cd backend && npx vitest run src/__tests__/pbsSync.validation.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard syncPBSToComponents validates parentId + ids (#293)
        run: |
          set -e
          f=backend/src/controllers/component.controller.ts
          fail=0
          if ! grep -q "parentId is not a component of this project" "$f"; then
            echo "::error file=$f::syncPBSToComponents must reject foreign parentId (see issue #293)"
            fail=1
          fi
          if ! grep -q "Component id collision with a foreign project" "$f"; then
            echo "::error file=$f::syncPBSToComponents must reject foreign id collisions (see issue #293)"
            fail=1
          fi
          exit $fail

      - name: Run admin audit-log tenant regression (#288)
        run: cd backend && npx vitest run src/__tests__/adminAudit.tenant.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard admin audit-log tenant scope (#288)
        run: |
          set -e
          f=backend/src/controllers/admin.controller.ts
          fail=0
          # Must consult caller's company + SUPERIOR_ADMIN status.
          if ! grep -q "SUPERIOR_ADMIN" "$f"; then
            echo "::error file=$f::getAuditLog must check SUPERIOR_ADMIN bypass (see issue #288)"
            fail=1
          fi
          if ! grep -q "allowedProjectIds" "$f"; then
            echo "::error file=$f::getAuditLog must scope by allowedProjectIds (see issue #288)"
            fail=1
          fi
          svc=backend/src/services/adminUserRole.service.ts
          if ! grep -q "callerCompany" "$svc"; then
            echo "::error file=$svc::listAssignments must accept a callerCompany filter (see issue #288)"
            fail=1
          fi
          exit $fail

      - name: Run engineering-role tenant regression (#287)
        run: cd backend && npx vitest run src/__tests__/engineeringRole.tenant.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard engineering-role controller tenant scopes (#287)
        run: |
          set -e
          f=backend/src/controllers/engineeringRoles.controller.ts
          fail=0
          if ! grep -q "resolveCallerCompany" "$f"; then
            echo "::error file=$f::resolveCallerCompany helper missing (see issue #287)"
            fail=1
          fi
          # assign / unassign must compare the caller's company against target users.
          if ! grep -q "Cannot assign roles to users outside your company" "$f"; then
            echo "::error file=$f::assignEngineeringRole must reject cross-company targets (see issue #287)"
            fail=1
          fi
          if ! grep -q "Cannot unassign roles for users outside your company" "$f"; then
            echo "::error file=$f::unassignEngineeringRole must reject cross-company targets (see issue #287)"
            fail=1
          fi
          exit $fail

      - name: Run csv import/export IDOR regression (#291)
        run: cd backend && npx vitest run src/__tests__/csvImportExport.idor.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard csv routes gate by body project membership (#291)
        run: |
          set -e
          f=backend/src/routes/importExport.routes.ts
          fail=0
          if ! grep -q "requireBodyProjectMember" "$f"; then
            echo "::error file=$f::csv import/export routes must use requireBodyProjectMember (see issue #291)"
            fail=1
          fi
          ctrl=backend/src/controllers/importExport.controller.ts
          if ! grep -q "csvSafeCell" "$ctrl"; then
            echo "::error file=$ctrl::csv export must neutralise formula triggers via csvSafeCell (see issue #291)"
            fail=1
          fi
          exit $fail

      - name: Run function-delete cascade regression (#290)
        run: cd backend && npx vitest run src/__tests__/function.deleteCascade.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard function deleteCascade gates hard delete (#290)
        run: |
          set -e
          f=backend/src/controllers/function.controller.ts
          fail=0
          # Must consult the explicit flag before hard-deleting issues.
          if ! grep -q "deleteLinkedIssues" "$f"; then
            echo "::error file=$f::deleteFunction must read ?deleteLinkedIssues flag (see issue #290)"
            fail=1
          fi
          # Must audit-log every hard-deleted issue.
          if ! grep -q "ISSUE_HARD_DELETED_VIA_FUNCTION_CASCADE" "$f"; then
            echo "::error file=$f::hard cascade must write AuditLog entries (see issue #290)"
            fail=1
          fi
          # Must check admin / owner before the cascade.
          if ! grep -q "isAdminUser" "$f"; then
            echo "::error file=$f::hard cascade must gate on isAdminUser / project owner (see issue #290)"
            fail=1
          fi
          exit $fail

      - name: Run time-tracking access regression (#286)
        run: cd backend && npx vitest run src/__tests__/timeTracking.access.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard time-tracking routes enforce membership (#286)
        run: |
          set -e
          f=backend/src/routes/timeTracking.routes.ts
          fail=0
          for needle in requireBodyTaskProjectMember requireBodyProjectMember requireTimeLogProjectMember; do
            if ! grep -q "$needle" "$f"; then
              echo "::error file=$f::missing $needle gate on time-tracking routes (see issue #286)"
              fail=1
            fi
          done
          exit $fail

      - name: Run transition-checklist IDOR regression (#297)
        run: cd backend && npx vitest run src/__tests__/transitionChecklist.idor.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard transitionChecklist service scopes by projectId (#297)
        run: |
          set -e
          f=backend/src/services/transitionChecklist.service.ts
          fail=0
          # Every pre-fix findUnique by id alone must be gone.
          if grep -nE "transitionChecklist\.findUnique\(\s*\{\s*where:\s*\{\s*id:\s*checklistId\s*\}" "$f"; then
            echo "::error file=$f::transitionChecklist.findUnique({id:checklistId}) missing projectId (see issue #297)"
            fail=1
          fi
          if grep -nE "checklistAssignment\.delete\(\s*\{\s*where:\s*\{\s*id:\s*assignmentId\s*\}\s*\}\s*\)" "$f"; then
            echo "::error file=$f::checklistAssignment.delete by id alone missing projectId (see issue #297)"
            fail=1
          fi
          # getById / update / deleteChecklist signatures must take projectId first.
          if ! grep -q "async getById(projectId: string" "$f"; then
            echo "::error file=$f::service getById must take projectId (see issue #297)"
            fail=1
          fi
          if ! grep -q "async update(projectId: string" "$f"; then
            echo "::error file=$f::service update must take projectId (see issue #297)"
            fail=1
          fi
          if ! grep -q "async deleteChecklist(projectId: string" "$f"; then
            echo "::error file=$f::service deleteChecklist must take projectId (see issue #297)"
            fail=1
          fi
          exit $fail

      - name: Run saved-view access-control regression (#294)
        run: cd backend && npx vitest run src/__tests__/savedView.access.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard saved-view handlers enforce ownership (#294)
        run: |
          set -e
          f=backend/src/controllers/savedView.controller.ts
          fail=0
          # Every mutating handler must call callerCanAccessView before the
          # findFirst/update/delete. Absence of the helper is a red flag.
          if ! grep -q "callerCanAccessView" "$f"; then
            echo "::error file=$f::callerCanAccessView helper missing — handlers have no access control (see issue #294)"
            fail=1
          fi
          if ! grep -q "isMemberOfProject" "$f"; then
            echo "::error file=$f::isMemberOfProject missing — project-scoped views must enforce membership (see issue #294)"
            fail=1
          fi
          exit $fail

      - name: Run issue-controller cross-project IDOR regression (#285)
        run: cd backend && npx vitest run src/__tests__/issue.idor.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard issue controllers scope lookups by projectId (#285)
        run: |
          set -e
          f=backend/src/controllers/issue.controller.ts
          fail=0
          # No issue lookup may use findUnique({ where: { id } }) — that is the
          # pre-fix IDOR shape. Authenticated lookups must go through findFirst
          # with both id and projectId.
          if grep -nE "prisma\.issue\.findUnique\(\s*\{\s*where:\s*\{\s*id\s*\}\s*\}\s*\)" "$f"; then
            echo "::error file=$f::prisma.issue.findUnique({where:{id}}) missing projectId scope (see issue #285)"
            fail=1
          fi
          if grep -nE "prisma\.issueComment\.findUnique\(\s*\{\s*where:\s*\{\s*id:\s*commentId\s*\}\s*\}\s*\)" "$f"; then
            echo "::error file=$f::issueComment.findUnique({where:{id:commentId}}) missing projectId scope (see issue #285)"
            fail=1
          fi
          if grep -nE "prisma\.issueLink\.findUnique\(\s*\{\s*where:\s*\{\s*id:\s*linkId\s*\}\s*\}\s*\)" "$f"; then
            echo "::error file=$f::issueLink.findUnique({where:{id:linkId}}) missing projectId relation walk (see issue #285)"
            fail=1
          fi
          exit $fail

      - name: Run /search cross-tenant regression (#296)
        run: cd backend && npx vitest run src/__tests__/search.crossTenant.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Verify /search scopes queries by projectId (#296)
        run: |
          set -e
          f=backend/src/routes/search.routes.ts
          fail=0
          # Admin bypass must remain in place.
          if ! grep -q "isAdminUser" "$f"; then
            echo "::error file=$f::search must consult isAdminUser for admin bypass (see issue #296)"
            fail=1
          fi
          # Caller's project memberships must be loaded.
          if ! grep -q "projectMember.findMany" "$f"; then
            echo "::error file=$f::search must load projectMember.findMany for caller scope (see issue #296)"
            fail=1
          fi
          # At minimum the shared projectScope name must be present in the
          # handler so the 12 entity queries scope by projectId.
          if ! grep -q "projectScope" "$f"; then
            echo "::error file=$f::search must scope findMany queries by projectScope (see issue #296)"
            fail=1
          fi
          exit $fail

      - name: Run change-request concurrency regression suite (#162)
        run: cd backend && npx vitest run src/__tests__/changeRequest.key.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Run lifecycle control tower IDOR regression (#164)
        run: cd backend && npx vitest run src/__tests__/lifecycle.controlTower.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Verify change-request controller uses atomic CR-ID allocator (#162)
        run: |
          set -e
          ctrl=backend/src/controllers/changeRequest.controller.ts
          if ! grep -q "allocateChangeRequestId" "$ctrl"; then
            echo "::error file=$ctrl::allocateChangeRequestId not referenced (see issue #162)"
            exit 1
          fi
          if grep -q "changeRequest.count" "$ctrl"; then
            echo "::error file=$ctrl::racy 'changeRequest.count' still used for CR-ID generation (see issue #162)"
            exit 1
          fi
          if ! grep -q "pg_advisory_xact_lock" backend/src/lib/crId.ts; then
            echo "::error file=backend/src/lib/crId.ts::allocator is missing pg_advisory_xact_lock (see issue #162)"
            exit 1
          fi

      - name: Verify lifecycle control tower enforces project membership (#164)
        run: |
          set -e
          f=backend/src/routes/lifecycle.routes.ts
          if ! grep -q "requireProjectMember" "$f"; then
            echo "::error file=$f::missing requireProjectMember middleware (see issue #164)"
            exit 1
          fi
          if ! grep -q "projectIdParam" "$f"; then
            echo "::error file=$f::missing projectIdParam resolver (see issue #164)"
            exit 1
          fi
          if grep -q "req.query.projectId" "$f"; then
            echo "::error file=$f::projectId must not be read from req.query (see issue #164)"
            exit 1
          fi
          if grep -q "?? 'default'" "$f"; then
            echo "::error file=$f::'default' projectId fallback must be removed (see issue #164)"
            exit 1
          fi

      - name: Verify admin user-role module files exist (#166)
        run: |
          set -euo pipefail
          test -f backend/src/services/adminUserRole.service.ts
          test -f backend/src/controllers/adminUserRole.controller.ts
          test -f backend/src/routes/adminUserRole.routes.ts
          test -f backend/src/__tests__/adminUserRole.test.ts
          grep -q "adminUserRole" backend/src/routes/index.ts
          grep -q "model UserAdminRole" backend/prisma/schema.prisma

      - name: Run admin user-role integration tests (#166)
        run: cd backend && npx vitest run src/__tests__/adminUserRole.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Guard against unsafe verification upload regressions (#131,#139)
        run: |
          set -e
          missing=0
          for f in \
            backend/src/services/verification/testResult.service.ts \
            backend/src/services/verification/customSection.service.ts \
            backend/src/controllers/verification/setup.controller.ts \
            backend/src/controllers/verification/testRun.controller.ts; do
            if ! grep -q "validateUpload\|validateMulterUpload" "$f"; then
              echo "::error file=$f::must call validateUpload (issue #131,#139)"
              missing=1
            fi
            if grep -n "path.extname(fileName)\|path.extname(name)" "$f" >/dev/null; then
              echo "::error file=$f::do not derive extension from client-supplied filename (#131)"
              missing=1
            fi
          done
          exit $missing

      - name: Guard verification key atomicity + cascade (#135,#136,#137)
        run: |
          set -e
          if grep -n "verificationService\.generateTestCaseKey\|verificationService\.generateTestPlanKey" \
              backend/src/controllers/verification/testCase.controller.ts \
              backend/src/controllers/verification/testPlan.controller.ts; then
            echo "::error::generateTestCaseKey/generateTestPlanKey must not be used directly (issue #135)"
            exit 1
          fi
          for f in \
            backend/src/controllers/verification/testCase.controller.ts \
            backend/src/controllers/verification/testPlan.controller.ts; do
            if ! grep -q "allocateTestCaseKey\|allocateTestPlanKey" "$f"; then
              echo "::error file=$f::must use atomic allocator from lib/verificationKey (issue #135)"
              exit 1
            fi
          done
          if ! grep -A 30 "deleteTestCase = " backend/src/controllers/verification/testCase.controller.ts | grep -q 'prisma\.\$transaction'; then
            echo "::error file=backend/src/controllers/verification/testCase.controller.ts::deleteTestCase must be wrapped in prisma.\$transaction (issue #136)"
            exit 1
          fi

      - name: Guard DataFlowAdminPanel confirms destructive commands (#266)
        run: |
          set -e
          f=frontend/src/pages/PlatformAdmin/DataFlowAdminPanel.tsx
          fail=0
          # The ADMIN_COMMAND_SPECS table must exist so the set of allowed
          # commands is explicit and auditable.
          if ! grep -q "ADMIN_COMMAND_SPECS" "$f"; then
            echo "::error file=$f::ADMIN_COMMAND_SPECS registry missing (see issue #266)"
            fail=1
          fi
          # Halt and Rollout must gate on a typed confirmation phrase.
          if ! grep -q "CONFIRM HALT" "$f"; then
            echo "::error file=$f::Halt Sys must require typed 'CONFIRM HALT' (see issue #266)"
            fail=1
          fi
          if ! grep -q "CONFIRM ROLLOUT" "$f"; then
            echo "::error file=$f::Rollout must require typed 'CONFIRM ROLLOUT' (see issue #266)"
            fail=1
          fi
          # Sidebar onCommand prop must be wired to requestCommand
          # (the confirmation wrapper), never directly to executeCommand or
          # to a bare emit.
          if grep -q "onCommand={handleCommand}" "$f"; then
            echo "::error file=$f::sidebar onCommand must go through requestCommand (see issue #266)"
            fail=1
          fi
          if grep -q "onCommand={executeCommand}" "$f"; then
            echo "::error file=$f::sidebar onCommand must not bypass the confirmation modal (see issue #266)"
            fail=1
          fi
          # The ambiguous "Terminal Selected" label must not return.
          if grep -q "Terminal Selected" "$f"; then
            echo "::error file=$f::rename 'Terminal Selected' to 'Remove Node' (see issue #266)"
            fail=1
          fi
          exit $fail

      - name: Verify comm.routes nested tiers carry :projectId (#289)
        run: |
          set -e
          f=backend/src/routes/comm.routes.ts
          fail=0
          # Every router handler in comm.routes must mount under /:projectId/...
          # Before #289 the nested message/field tiers bypassed projectIdParam
          # by routing on /buses/:busId/... or /messages/:messageId/... directly.
          if grep -nE "router\.(get|post|put|patch|delete)\('/[^:]" "$f"; then
            echo "::error file=$f::every comm route must start with /:projectId (see issue #289)"
            fail=1
          fi
          if grep -nE "router\.(get|post|put|patch|delete)\('/buses/:busId" "$f"; then
            echo "::error file=$f::nested /buses/:busId route bypasses project membership (see issue #289)"
            fail=1
          fi
          if grep -nE "router\.(get|post|put|patch|delete)\('/messages/:" "$f"; then
            echo "::error file=$f::nested /messages/:id route bypasses project membership (see issue #289)"
            fail=1
          fi
          if grep -nE "router\.(get|post|put|patch|delete)\('/fields/:" "$f"; then
            echo "::error file=$f::nested /fields/:id route bypasses project membership (see issue #289)"
            fail=1
          fi
          # Service layer must scope each nested op by projectId.
          svc=backend/src/services/comm.service.ts
          for needle in assertBusInProject assertMessageInProject assertFieldInProject; do
            if ! grep -q "$needle" "$svc"; then
              echo "::error file=$svc::missing $needle ownership check (see issue #289)"
              fail=1
            fi
          done
          exit $fail

      - name: Run comm cross-project IDOR regression (#289)
        run: cd backend && npx vitest run src/__tests__/comm.idor.test.ts
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret

      - name: Verify changeMyPassword requires currentPassword (#274)
        run: |
          set -e
          f=backend/src/controllers/auth.controller.ts
          # The handler must pull currentPassword out of req.body ...
          if ! grep -qE "const \{[^}]*currentPassword[^}]*\} = req\.body" "$f"; then
            echo "::error file=$f::changeMyPassword must read currentPassword from req.body (see issue #274)"
            exit 1
          fi
          # ... and verify it with bcrypt.compare before updating the hash.
          if ! grep -q "bcrypt.compare(currentPassword" "$f"; then
            echo "::error file=$f::changeMyPassword must verify currentPassword with bcrypt.compare (see issue #274)"
            exit 1
          fi
          # Frontend service must forward currentPassword to the server.
          svc=frontend/src/services/auth.service.ts
          if ! grep -q "currentPassword" "$svc"; then
            echo "::error file=$svc::auth.service must send currentPassword with changeMyPassword (see issue #274)"
            exit 1
          fi
          # Callers must invoke changeMyPassword with TWO arguments
          # (currentPassword, newPassword). A single-argument call is the
          # pre-fix takeover shape.
          for f in frontend/src/pages/Settings/SettingsPage.tsx frontend/src/components/auth/ForceChangePasswordModal.tsx; do
            if ! grep -qE "changeMyPassword\s*\(\s*\w+\s*,\s*\w+" "$f"; then
              echo "::error file=$f::changeMyPassword caller must pass currentPassword as first arg (see issue #274)"
              exit 1
            fi
          done

      - name: Guard send-invite script does not leak temp password (#303)
        run: |
          set -e
          f=backend/src/scripts/send-invite-to-email.ts
          if grep -qE "console\.log\(.*tempPassword" "$f"; then
            echo "::error file=$f::temp password must not be written to stdout (see issue #303)"
            exit 1
          fi

      - name: Guard docker-compose postgres creds are env-substituted (#283)
        run: |
          set -e
          f=docker-compose.yml
          fail=0
          # Pre-fix shape: literal POSTGRES_PASSWORD value with no ${VAR}
          # substitution. Literal user/password commits are also bad.
          if grep -qE "POSTGRES_PASSWORD:\s*[^$\s][^\n]*$" "$f"; then
            if ! grep -qE 'POSTGRES_PASSWORD:\s*\$\{' "$f"; then
              echo "::error file=$f::POSTGRES_PASSWORD must use env substitution (see issue #283)"
              fail=1
            fi
          fi
          if ! grep -qE 'POSTGRES_USER:\s*\$\{' "$f"; then
            echo "::error file=$f::POSTGRES_USER must use env substitution (see issue #283)"
            fail=1
          fi
          if ! grep -qE 'POSTGRES_DB:\s*\$\{' "$f"; then
            echo "::error file=$f::POSTGRES_DB must use env substitution (see issue #283)"
            fail=1
          fi
          exit $fail

      - name: Guard destructive scripts require env + confirmation (#300,#301)
        run: |
          set -e
          fail=0
          for f in \
            backend/src/scripts/delete-stale-project.ts \
            backend/src/scripts/reassign-project-owner.ts; do
            if ! grep -q "ALLOW_DESTRUCTIVE_SCRIPTS" "$f"; then
              echo "::error file=$f::missing ALLOW_DESTRUCTIVE_SCRIPTS env gate (see issues #300,#301)"
              fail=1
            fi
            if ! grep -q "NODE_ENV === 'production'" "$f"; then
              echo "::error file=$f::missing NODE_ENV=production refusal (see issues #300,#301)"
              fail=1
            fi
          done
          # delete-stale-project.ts must not reintroduce a hardcoded UUID.
          if grep -qE "PROJECT_ID_TO_DELETE\s*=\s*'[0-9a-f-]{36}'" backend/src/scripts/delete-stale-project.ts; then
            echo "::error file=backend/src/scripts/delete-stale-project.ts::hardcoded project id must not return (see issue #300)"
            fail=1
          fi
          exit $fail

      - name: Guard against duplicated resolveIsAdmin + auth console.log (#146,#151)
        run: |
          set -e
          if grep -n "async function resolveIsAdmin" backend/src/middleware/auth.middleware.ts backend/src/controllers/auth.controller.ts; then
            echo "::error::resolveIsAdmin must only be defined in backend/src/lib/adminAuth.ts (issue #151)"
            exit 1
          fi
          if grep -n "console.log" backend/src/middleware/auth.middleware.ts; then
            echo "::error file=backend/src/middleware/auth.middleware.ts::remove console.log (issue #146)"
            exit 1
          fi

      - name: Verify projects.routes.ts enforces owner/admin + membership (#152,#153,#154)
        run: |
          set -e
          f=backend/src/routes/projects.routes.ts
          fail=0
          if ! grep -qE "router\.put\('/:id'.*requireProjectOwnerOrAdmin.*updateProject" "$f"; then
            echo "::error file=$f::PUT /:id must use requireProjectOwnerOrAdmin (see #152)"
            fail=1
          fi
          if ! grep -qE "router\.delete\('/:id'.*requireProjectOwnerOrAdmin.*deleteProject" "$f"; then
            echo "::error file=$f::DELETE /:id must use requireProjectOwnerOrAdmin (see #152)"
            fail=1
          fi
          for path in analytics members audit-logs; do
            if ! grep -qE "router\.get\('/:id/$path'.*requireProjectMember" "$f"; then
              echo "::error file=$f::GET /:id/$path must use requireProjectMember (see #153)"
              fail=1
            fi
          done
          if ! grep -qE "router\.post\('/import'.*authenticateToken" "$f"; then
            echo "::error file=$f::POST /import must use authenticateToken (see #154)"
            fail=1
          fi
          exit $fail

      - name: SAST grep-guard - no spread of untrusted input in project controller (#154)
        run: |
          set -e
          f=backend/src/controllers/project.controller.ts
          fail=0
          if grep -nE "\\.\\.\\.req\\.body" "$f"; then
            echo "::error file=$f::do not spread req.body in project.controller (see #154)"
            fail=1
          fi
          if grep -nE "prisma\\.project\\.createMany\\(\\s*\\{\\s*data:\\s*[^}]*\\.\\.\\." "$f"; then
            echo "::error file=$f::prisma.project.createMany must not spread untrusted input (see #154)"
            fail=1
          fi
          if grep -nE "projects\\.map\\([^)]*\\.\\.\\." "$f"; then
            echo "::error file=$f::projects.map spread is the #154 exploit pattern - use explicit allowlist"
            fail=1
          fi
          exit $fail

      - name: Verify task subsystem enforces project membership (#159,#160)
        run: |
          set -e
          missing=0
          for f in \
            backend/src/routes/tasks.routes.ts \
            backend/src/routes/attachments.routes.ts \
            backend/src/routes/relations.routes.ts \
            backend/src/routes/board.routes.ts \
            backend/src/routes/taskAnalytics.routes.ts; do
            if ! grep -q "requireTaskProjectMember\|requireBodyProjectMember\|requireBodyTaskProjectMember" "$f"; then
              echo "::error file=$f::missing task-project-membership middleware (see issue #159)"
              missing=1
            fi
          done
          if grep -E "authorName:\s*(author_name|req\.body\.author_name)" backend/src/controllers/comment.controller.ts; then
            echo "::error file=backend/src/controllers/comment.controller.ts::author_name must be derived from req.user, not req.body (see issue #160)"
            missing=1
          fi
          exit $missing

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: engineering_user
          POSTGRES_PASSWORD: engineering_password
          POSTGRES_DB: engineering_tool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install shared dependencies
        run: cd shared && npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Create backend .env
        run: |
          cat > backend/.env << 'ENVEOF'
          DATABASE_URL="postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool"
          JWT_SECRET="ci-test-secret-key"
          NODE_ENV=development
          PORT=5000
          ENVEOF

      - name: Generate Prisma client and push schema
        run: cd backend && npx prisma generate && npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool

      - name: Seed users
        run: cd backend && npm run seed:users
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool

      - name: Seed demo project
        run: cd backend && npm run seed:demo
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool

      - name: Start backend
        run: cd backend && npm run dev &
        env:
          DATABASE_URL: postgresql://engineering_user:engineering_password@localhost:5432/engineering_tool
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: development
          PORT: 5000

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done

      - name: Start frontend dev server
        run: cd frontend && npm run dev &

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done

      - name: Run Playwright e2e tests
        run: cd frontend && npm run test:e2e
        env:
          # Credentials are read from GitHub Actions secrets. Configure under
          # Repo Settings > Secrets and variables > Actions:
          #   E2E_TEST_EMAIL     - username/email of the e2e test account
          #   E2E_TEST_PASSWORD  - password of the e2e test account
          # Never put real credentials in this file.
          E2E_USERNAME: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
